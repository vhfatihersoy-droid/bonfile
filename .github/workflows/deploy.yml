name: Validate storefront and publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install current application
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Check current application types
        working-directory: site
        run: npm run typecheck
      - name: Test catalog, pricing, cart and CMS authorization
        working-directory: site
        run: npm test
      - name: Build current application
        working-directory: site
        run: npm run build
      - name: Build storefront for GitHub Pages
        working-directory: site
        run: |
          npm run build:pages
          touch dist-pages/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
